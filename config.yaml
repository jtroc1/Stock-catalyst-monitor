watchlist:
  stocks:
    - TSLA
    - VASO
    - PYPL
    - QQQ
    - DUOL
    - SEI
    - QCOM
    - GLW
    - BE
    - ROIV
    - CHYM
    - META
    - SIG
  crypto:
    - BTC-USD
    - ETH-USD
    - SOL-USD
    - XRP-USD
    - DOGE-USD
    - AVAX-USD
    - LINK-USD
    - DOT-USD
    - ADA-USD
    - NEAR-USD
    - INJ-USD
commodities:
    - GC=F
    - SI=F
    - CL=F
    - NG=F
    - HG=F
    - ZC=F
    - GLD
    - SLV
    - USO
